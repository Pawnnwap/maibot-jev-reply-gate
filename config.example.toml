[plugin]
enabled = true
config_version = "1.5.0"

[features]
# 三个功能的总开关。
# 接话判断：在 planner 请求前判断是否回复；判无需回复时移除 reply 工具。
reply_enabled = true
# 重复低效过滤：回复生成后判断是否与上一条重复，必要时请求重生成。
duplicate_enabled = true
# 未完成事项：每轮 bot 发话后检查是否有未兑现的承诺或待办。
unfinished_enabled = true

[service]
# jev = 直接调用 /v1/systemone；llm = 用兼容 LLM 的 logprobs 模拟 systemone。
mode = "jev"

[jev]
# 兼容 /v1/systemone 的决策服务地址。
api_url = "http://127.0.0.1:8090"
# 请求中携带的模型名；留空使用服务默认值。
model = ""
# 单次决策请求超时秒数。
timeout_seconds = 5.0

[llm]
# OpenAI 兼容 Chat Completions 服务地址，例如 Spark X2.6 的 /v2。
base_url = "https://maas-api.cn-huabei-1.xf-yun.com/v2"
# LLM API Key，按 Bearer 发送；只保存在本地配置，不要提交到仓库。
api_key = ""
# LLM 模型名，例如 spark-x2.6。
model = "spark-x2.6"
# 单次 LLM 请求超时秒数。
timeout_seconds = 5.0

# UI 只展示常用判定标准；以下其余 Prompt 为高级选项，可按需手动覆盖。
# 删掉某项则回退到插件内置默认值。
# 占位符：{criteria} / {shared} / {ratio} / {record} / {last_message} / {probability}
[prompts]
reply_question_template = "根据以上聊天记录和标注为【最新消息】的用户消息，助手现在应该继续回复吗？"
reply_criteria_true = "应该选Yes：最新消息提出了问题、请求、新信息、新话题、纠正，或明确表达情绪并希望被接住。"
reply_criteria_false = "命中以下任意情形之一直接选No：\n1. 用户最新消息属于[好、嗯嗯、好呀、好哦、好的、收到、谢谢、哈哈、晚安]等礼貌性词汇\n2. 用户明确说：先不打扰你了\n3. 用户只是在附和助手，且助手已经回应过用户"
duplicate_question_template = "候选是否与上一条回复重复低效？\n\n判断标准：\n{criteria}"
duplicate_criteria = "算重复：候选与上一条回复意思相近、只是换说法，或几乎没有新增信息。\n不算重复：候选带来新信息、推进话题，或与上一条回复明显不同。"
duplicate_rule_context_template = "规则比对：候选与此前的一条回复存在最长相同片段「{shared}」（占候选回复 {ratio:.0%}）。那条回复原文：\n「{record}」"
duplicate_retry_reason = "重复度{probability:.0%}，属于重复低效。请换一个信息点或角度，避免复读你自己之前的回复，也不要只是把用户的话换个说法。"
unfinished_question = "上一轮对话结束后，助手是否还有明确承诺或待办没有完成？只有确实需要继续行动时才选 Yes。"
unfinished_criteria_true = "有未完成事项：助手明确说要搜索、查证、整理、稍后给结论或帮用户做什么，但还没有结果或完成动作；或用户提出了明确请求而助手尚未处理。"
unfinished_criteria_false = "没有未完成事项：助手已经回答完用户的问题、给出结论或完成动作；只是普通收尾、道别、闲聊；用户已取消请求或转移话题；或没有需要继续处理的事。"
unfinished_intent_template = "上一轮对话结束后，检查发现你还有未完成的事，尤其是你答应过用户但还没兑现的承诺。请回看最近聊天，先完成这件事（需要查资料就调用工具或子代理），再自然地向用户补充结果；不要开启无关话题。\n你最后一条消息是：“{last_message}”"

[decision]
# 回复概率达到该值才继续接话；越高越安静。
reply_threshold = 0.5

[unfinished]
# 最后一条 bot 消息后等待多久扫描，最大 120 秒。
scan_delay_seconds = 120.0
# 判定存在未完成事项的概率阈值。
threshold = 0.5

[duplicate]
# 判定重复低效的概率阈值。
threshold = 0.4
# 最多请求重生成几次；受主程序 Hook 重试上限 3 约束，0 表示不重试。
max_retries = 3
# 规则比对回看最近多少条消息，只比对其中 bot 自身的发言。
recent_window = 30
# 最长共享片段达到多少字，才把规则比对结果作为依据附给 JEV。
rule_min_shared_chars = 6
