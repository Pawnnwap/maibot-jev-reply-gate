[plugin]
enabled = true
config_version = "1.4.0"

[features]
# 三个功能的总开关。
# 接话判断：用户只回“嗯嗯”“好呀”等收尾消息时，不再机械接话。
reply_enabled = true
# 重复低效过滤：回复生成后判断是否与上一条重复，必要时请求重生成。
duplicate_enabled = true
# 未完成事项：每轮 bot 发话后检查是否有未兑现的承诺或待办。
unfinished_enabled = true

[service]
# jev = 直接调用 /v1/systemone；llm = 用兼容 LLM 的 logprobs 模拟 systemone。
mode = "jev"

[jev]
# 兼容 /v1/systemone 的决策服务地址。
api_url = "http://127.0.0.1:8090"
# 请求中携带的模型名；留空使用服务默认值。
model = ""
# 单次决策请求超时秒数。
timeout_seconds = 5.0

[llm]
# OpenAI 兼容 Chat Completions 服务地址，例如 Spark X2.6 的 /v2。
base_url = "https://maas-api.cn-huabei-1.xf-yun.com/v2"
# LLM API Key，按 Bearer 发送；只保存在本地配置，不要提交到仓库。
api_key = ""
# LLM 模型名，例如 spark-x2.6。
model = "spark-x2.6"
# 单次 LLM 请求超时秒数。
timeout_seconds = 5.0

# UI 只展示常用判定标准；以下其余 Prompt 为高级选项，可按需手动覆盖。
# 删掉某项则回退到插件内置默认值。
# 占位符：{draft_reply} / {last_bot} / {candidate} / {criteria} / {last_message} / {probability} / {threshold}
[prompts]
reply_system_prompt = "你正在和对方私聊。判断你现在还要不要继续回复最新一条用户消息。\n只依据聊天记录和下面的拟回复判断。\n\n1. 用户只回“嗯嗯”“好呀”“好的”“收到”“谢谢”“哈哈”“晚安”“先这样”“行吧”等短词，通常表示听到了、同意或准备结束。\n2. 如果你上一条已经回答、确认或处理了用户的最新需求，这些短回应就是收尾信号，不必再回“不客气”“好的呀”“哈哈”。\n3. 只有最新消息提出新问题、请求、新信息、新话题、纠正，明确表达情绪并希望被接住，或继续追问；或者拟回复会给出用户尚未得到的新内容、确认下一步行动时，才继续回复。\n4. 用户只是对你的提议说“好呀”时，如果拟回复要落实提议、确认细节或执行下一步，就回复；如果只是再客套一句，就不回复。\n5. 不确定时，优先不回复。"
reply_question_template = "结合最近的私聊记录和下面的拟回复，你现在应该继续回复最新这条用户消息吗？\n拟回复（仅供判断，不是用户的话）：\n{draft_reply}"
reply_criteria_true = "应该回复：最新消息提出了问题、请求、新信息、新话题、纠正，或拟回复包含用户尚未得到的新内容、需要落实的下一步。"
reply_criteria_false = "不必回复：最新消息只是嗯嗯、好呀、好的、收到、谢谢、哈哈、晚安等附和或收尾，你已经回应过用户的最新需求；或拟回复只是想再附和、客套一句。"
reply_empty_draft = "（没有额外说明。）"
reply_blocked_reason = "主动保持安静（非故障）：最新私聊消息只是收尾或附和（回复概率 {probability:.2f}，阈值 {threshold:.2f}），你已经回应过用户的最新需求。请结束本轮，不要重复回复。"
duplicate_system_prompt = "比较你最近一条回复和候选回复。只依据给出的聊天上下文和两条文本判断。\n两条回复意思相同、候选只是换个说法，或候选几乎没有新增信息，就算重复。\n候选带来新信息、回应用户最新消息、推进话题，就不算重复。"
duplicate_question_template = "你最近一条回复：\n「{last_bot}」\n\n候选回复：\n「{candidate}」\n\n判断标准：\n{criteria}\n\n候选回复是否重复低效（与最近一条回复意思重复、没有新增信息、没有推进对话）？"
duplicate_criteria = "两条回复意思相同、候选只是换个说法，或候选几乎没有新增信息，就算重复。\n候选带来新信息、回应用户最新消息、推进话题，就不算重复。"
duplicate_retry_reason = "重复度{probability:.0%}，属于重复低效。请换一个信息点或角度，避免复读最近说过的话，也不要只是把用户的话换个说法。"
unfinished_system_prompt = "检查上一轮私聊结束后，你是否还有没做完的事。只依据聊天记录判断。\n重点看你明确承诺、但还没兑现的事，如“我去搜一下”“稍后给你结论”“等我查查”“马上帮你弄”。\n用户提出明确请求（帮我看/帮我查/怎么解决），你只回“收到/好呀/稍后”而没有行动或结论，也算未完成。\n正常收尾、闲聊、道别，或已经给出结论/完成动作，不算未完成。\n用户后来取消请求、说“不用了”，或话题已明确转移，不算未完成。"
unfinished_question = "上一轮对话结束后，你是否还有明确承诺或待办没有完成？只有确实需要继续行动时才选 Yes。"
unfinished_criteria_true = "有未完成事项：你明确说要搜索、查证、整理、稍后给结论或帮用户做什么，但还没有结果或完成动作；或用户提出了明确请求而你尚未处理。"
unfinished_criteria_false = "没有未完成事项：你已经回答完用户的问题、给出结论或完成动作；只是普通收尾、道别、闲聊；用户已取消请求或转移话题；或没有需要继续处理的事。"
unfinished_intent_template = "上一轮对话结束后，检查发现你还有未完成的事，尤其是你答应过用户但还没兑现的承诺。请回看最近聊天，先完成这件事（需要查资料就调用工具或子代理），再自然地向用户补充结果；不要开启无关话题。\n你最后一条消息是：“{last_message}”"

[decision]
# 回复概率达到该值才继续接话；越高越安静。
reply_threshold = 0.3

[unfinished]
# 最后一条 bot 消息后等待多久扫描，最大 120 秒。
scan_delay_seconds = 120.0
# 判定存在未完成事项的概率阈值。
threshold = 0.5

[duplicate]
# 判定重复低效的概率阈值。
threshold = 0.6
# 最多请求重生成几次；受主程序 Hook 重试上限 3 约束，0 表示不重试。
max_retries = 3
